let okQ,hQ,QI;
function qroom(i){
  QI=i;okQ=new Set();hQ=new Set();
  $('room').innerHTML=`<p>${i?'Lady Catherine no recibe a quien no conoce la historia. Responde las cinco preguntas para cruzar la puerta de Rosings.':'La puerta de la biblioteca está cerrada. Responde las cinco preguntas para abrirla. Si dudas, ¡busca en el libro!'}</p>`+
  QS[i].map((o,k)=>`<div class="card"><p>${k+1}. ${o.q}</p><div class="row"><input id="i${k}" autocomplete="off" placeholder="Tu respuesta"><button onclick="chk(${k})">Probar</button><button class="ghost" onclick="hint(${k})">Pista</button></div><small class="m" id="m${k}"></small></div>`).join('')+
  `<button id="nx" disabled onclick="go(${i+1})">Abrir la puerta</button>`;
}
function chk(i){
  const v=norm($('i'+i).value);if(!v||okQ.has(i))return;
  if(QS[QI][i].a.test(v)){okQ.add(i);$('m'+i).className='m ok';$('m'+i).textContent='✔ Correcto.';$('i'+i).disabled=true;
    if(okQ.size===QS[QI].length)$('nx').disabled=false}
  else{S.err++;hud();$('m'+i).className='m no';$('m'+i).textContent='✖ Esa no es. Revisa el libro e inténtalo de nuevo.'}
}
function hint(i){
  if(!hQ.has(i)){hQ.add(i);S.hints++;hud()}
  if(!okQ.has(i)){$('m'+i).className='m';$('m'+i).textContent='Pista: busca en el '+QS[QI][i].h+'.'}

/* ---- Salas de murdoku (2 y 4) ---- */
let Z,B,sel,hintM;
function mur(i){
  Z=PZ[i];B=Array.from({length:Z.n},()=>Array(Z.n).fill(''));sel=null;hintM=false;
  $('room').innerHTML=`<div class="card"><p>${Z.intro}</p>
  <p><b>Cómo se juega.</b> Elige un personaje y toca una casilla para ubicarlo. Cada personaje va en una fila y una columna distintas, como en un sudoku. Los colores son las salas. La casilla con ${Z.vi} está bloqueada.</p>
  <div class="clue"><b>Testimonios:</b></div>${Z.clues.map((c,k)=>`<div class="clue">${k+1}. ${c}</div>`).join('')}
  <div class="row"><button class="ghost" onclick="hintMu()">Pista (quién es quién)</button></div><small class="m" id="mh"></small></div>
  <div class="pal" id="pal"></div><div id="gd"></div><div class="leg">${Object.keys(Z.rn).map(k=>`<span><i style="background:${Z.rc[k]}"></i>${Z.rn[k]}</span>`).join('')}</div>
  <p style="text-align:center"><small class="m" id="mm"></small><button onclick="chkM()">Revisar tablero</button></p><div id="acc"></div>`;
  drawM();
}
function hintMu(){if(!hintM){hintM=true;S.hints++;hud()}$('mh').textContent='Pistas: '+Z.hint}
function conflicts(){
  const bad=new Set(),L=[];
  B.forEach((row,r)=>row.forEach((p,c)=>{if(p)L.push([r,c])}));
  for(const [a,b] of L)for(const [c,d] of L)if((a!==c||b!==d)&&(a===c||b===d))bad.add(a+','+b);
  return bad;
}
function drawM(){
  $('pal').innerHTML=Object.entries(Z.ppl).map(([k,[e,n]])=>`<button class="${sel===k?'on':''}" onclick="sel=sel==='${k}'?null:'${k}';drawM()">${e} ${n}${B.some(r=>r.includes(k))?' ✔':''}</button>`).join('');
  const bad=conflicts(),N=Z.n;let h='<b></b>'+Array.from({length:N},(_,k)=>`<b>${k+1}</b>`).join('');
  for(let r=0;r<N;r++){h+=`<b>${'ABCDE'[r]}</b>`;
    for(let c=0;c<N;c++){const v=r===Z.vic[0]&&c===Z.vic[1],k=Z.map[r][c];
      h+=`<button class="c${v?' v':''}${bad.has(r+','+c)?' bad':''}" style="--rc:${Z.rc[k]}" ${v?'disabled':`onclick="cell(${r},${c})"`} aria-label="Casilla ${'ABCDE'[r]}${c+1}, ${Z.rn[k]}">${v?Z.vi:(B[r][c]?Z.ppl[B[r][c]][0]:'')}</button>`}}
  $('gd').innerHTML=`<div class="grid" style="grid-template-columns:28px repeat(${N},1fr);max-width:${N*84}px">${h}</div>`;
}
function cell(r,c){
  const cur=B[r][c];
  if(cur&&(!sel||cur===sel)){B[r][c]='';drawM();return}
  if(!sel)return;
  B.forEach(row=>row.forEach((p,i)=>{if(p===sel)row[i]=''}));
  B[r][c]=sel;drawM();
}
function chkM(){
  const N=Z.n,placed=B.flat().filter(Boolean).length;
  if(placed<N){$('mm').className='m';$('mm').textContent='Falta ubicar a '+(N-placed)+' personaje(s).';return}
  const good=Object.entries(Z.sol).filter(([k,[r,c]])=>B[r][c]===k).length;
  if(good<N){S.err++;hud();$('mm').className='m no';$('mm').textContent=good+' de '+N+' bien ubicados. Relee los testimonios.';return}
  $('mm').className='m ok';$('mm').textContent='✔ ¡El tablero es correcto!';
  $('acc').innerHTML=`<div class="card"><p><b>Acusación.</b> ¿Quién estaba en la misma sala que la víctima?</p><div class="row"><select id="cu"><option value="">Elige…</option>${Object.entries(Z.ppl).map(([k,[e,n]])=>`<option value="${k}">${n}</option>`).join('')}</select><button onclick="accuse()">Acusar</button></div><small class="m" id="ma"></small></div>`;
}
function accuse(){
  const v=$('cu').value;if(!v)return;
  if(v!==Z.culp){S.err++;hud();$('ma').className='m no';$('ma').textContent='✖ Esa persona estaba en otra sala. Mira dónde cayó '+Z.vi+'.';return}
  $('acc').innerHTML=`<div class="card"><p class="ok"><b>✔ ¡Caso resuelto!</b></p><p>${Z.end}</p><button onclick="go(${S.room+1})">Continuar</button></div>`;
}

let ord,mk;
function r5(){
  ord=[5,2,7,0,4,1,6,3];mk={};
  $('room').innerHTML=`<p>Los retratos de Pemberley están desordenados. Ordena estos ocho sucesos de la historia, del <b>primero al último</b>, con las flechas.</p><p style="font-size:.9rem">Tras cada comprobación verás ✔ en los sucesos bien ubicados y ✖ en los mal ubicados. Si mueves un suceso, su marca desaparece hasta la próxima comprobación.</p><div id="ev"></div><small class="m" id="me"></small><button onclick="chkO()">Comprobar orden</button>`;
  drawO();
}
function drawO(){
  $('ev').innerHTML=ord.map((e,i)=>{const m=mk[i]===e?(e===i?'good':'bad'):'';
    return `<div class="ev ${m}"><b>${i+1}.</b><span>${EV[e][0]}</span><i aria-label="${m==='good'?'bien ubicado':m==='bad'?'mal ubicado':''}">${m==='good'?'✔':m==='bad'?'✖':''}</i><button class="ghost" ${i?'':'disabled'} onclick="mv(${i},-1)" aria-label="Subir">↑</button><button class="ghost" ${i<7?'':'disabled'} onclick="mv(${i},1)" aria-label="Bajar">↓</button></div>`}).join('');
}
function mv(i,d){[ord[i],ord[i+d]]=[ord[i+d],ord[i]];drawO()}
function chkO(){

  drawO();go(5);
}

const QZ=[
 {q:'¿Qué función cumple el señor Collins en la sátira social de la novela?',o:['Caricaturiza la adulación al rango: su servilismo deja en evidencia lo absurdo de la jerarquía que venera.','Representa el marido ideal de su época, cuyas virtudes Elizabeth termina reconociendo con el paso de los años.','Funciona como contrapunto trágico, pues su ambición social lo arrastra a una ruina económica irreparable.','Sirve de aliado de Darcy, a quien ayuda a ocultar el pasado turbio de Wickham durante su estancia en Hunsford.'],e:'Capítulos 13, 14 y 19. Collins es blanco principal de la ironía de la narradora: su pomposidad ridiculiza el culto al rango.'},
 {q:'¿Qué crítica implícita recibe el señor Bennet por la fuga de Lydia?',o:['Su ironía distante le hizo desestimar el consejo de Elizabeth y dejar sin vigilancia a la más imprudente.','Su excesiva severidad empujó a Lydia a huir de una disciplina doméstica que ya no soportaba más.','Su avaricia le impidió reunir una dote que habría permitido un cortejo formal, respetable y a salvo de escándalos.','Su amistad con los oficiales le hizo ignorar los rumores que corrían por Meryton sobre Wickham.'],e:'Capítulo 41. Elizabeth le advierte sobre el viaje a Brighton y él desestima el consejo con su habitual ironía.'},

 {q:'Cuando Charlotte defiende su boda con Collins, ¿cómo debe leerse ese pasaje?',o:['Como una crítica a un sistema que obliga a las mujeres sin fortuna a elegir entre seguridad y afecto.','Como una burla de la narradora hacia Charlotte por su frivolidad y su falta de principios morales.','Como prueba de que Charlotte ama en secreto a Collins y lo disimula con argumentos de índole práctica.','Como un episodio sin relación con el resto, pues Elizabeth no vuelve a pensar en la decisión de su amiga.'],e:'Capítulos 22 y 28. Charlotte actúa con lucidez, no por frivolidad; Elizabeth sigue dándole vueltas a la decisión de su amiga.'},
 {q:'¿Qué mueve a Wickham a aceptar casarse con Lydia?',o:['Un arreglo económico que le libra de deudas y le asegura una renta, más que cualquier afecto hacia ella.','El arrepentimiento sincero por haber puesto en peligro la reputación de una joven que confiaba en él.','La presión del coronel Forster, que lo amenaza con un consejo de guerra por haber abandonado el regimiento.','La promesa de Darcy de devolverle la rectoría que antes le había prometido su padre en Pemberley.'],e:'Capítulo 52. La boda llega cuando se saldan las deudas y se le asegura un sustento: no hay arrepentimiento ni afecto.'},

 {q:'¿Qué efecto irónico tiene la visita de lady Catherine para impedir el matrimonio?',o:['Alienta a Darcy a declararse de nuevo, pues le revela que Elizabeth se negó a prometer nada a su tía.','Persuade a Elizabeth de retroceder, por temor a las consecuencias que un escándalo traería a su familia.','Consigue que el señor Bennet prohíba el compromiso hasta que Darcy demuestre disponer de una renta mayor.','Obliga a Darcy a regresar a Rosings, donde su orgullo se enfría y sus sentimientos cambian por completo.'],e:'Capítulos 56 y 58. El efecto es el contrario al buscado: Darcy concibe esperanzas gracias a ella.'},
 {q:'¿Es exacto repartir los defectos del título, el orgullo para Darcy y el prejuicio para Elizabeth, como si no se cruzaran?',o:['No del todo: Elizabeth también se enorgullece de su perspicacia y Darcy prejuzga por rango y familia.','Sí: Darcy solo es orgulloso y Elizabeth solo prejuiciosa, y por eso su unión resulta tan complementaria.','No: ambos son únicamente orgullosos y el prejuicio corresponde en exclusiva a la señora Bennet y a Lydia.','Sí, y por eso ninguno cambia: la novela presenta caracteres inmutables desde el primer capítulo al último.'],e:'Capítulos 34 a 36. Ambos se equivocan por juzgar con soberbia o con prejuicio, y ambos se corrigen.'},

async function dpLoad(){
  const el=$('lv');if(!el)return;
  if(!CFG.LIVE_URL){el.innerHTML='<p>Seguimiento no configurado. Pega la dirección de tu base de datos en <code>CFG.LIVE_URL</code>.</p>';return}
  try{
    const d=await (await fetch(CFG.LIVE_URL+'/sesiones.json')).json()||{},now=Date.now();
    const rows=Object.values(d).filter(o=>o&&o.n).sort((a,b)=>(a.g+a.n).localeCompare(b.g+b.n));
    const st=o=>o.s==='fin'?['Terminó','ok']:(o.l>now?['Bloqueado','no']:(now-o.t>90000?['Sin señal','']:['En curso','']));
    const ago=ms=>ms<60000?Math.round(ms/1000)+' s':Math.round(ms/60000)+' min';
    const c={};rows.forEach(o=>{const k=st(o)[0];c[k]=(c[k]||0)+1});
    el.innerHTML=rows.length?`<p>${Object.entries(c).map(([k,v])=>k+': '+v).join(' · ')}</p><table><tr><th>Estudiante</th><th>Secc.</th><th>V</th><th>Sala</th><th>Estado</th><th>Err.</th><th>Pist.</th><th>Sal.</th><th>Señal</th></tr>`+
      rows.map(o=>{const s=st(o);return `<tr><td>${esc(o.n)}</td><td>${esc(o.g)}</td><td>${esc(o.v||'')}</td><td>${o.s==='fin'?'6/6':(+o.r+1)+'/6'}</td><td class="${s[1]}">${s[0]}</td><td>${+o.e||0}</td><td>${+o.h||0}</td><td>${+o.x||0}</td><td>${ago(now-o.t)}</td></tr>`}).join('')+'</table>':'<p>Aún no hay estudiantes conectados.</p>';
    $('lvt').textContent='(se actualiza cada 10 s)';
  }catch(e){el.innerHTML='<p class="no">No se pudo leer la base de datos. Revisa CFG.LIVE_URL y las reglas.</p>'}
}
async function dpClear(){
  if(!CFG.LIVE_URL||!confirm('¿Borrar todos los datos de seguimiento?'))return;
  try{await fetch(CFG.LIVE_URL+'/sesiones.json',{method:'DELETE'})}catch(e){}
  dpLoad();
}
function vf(){
  const t=$('vt').value.split(':'),s=(+t[0])*60+(+t[1]||0);
  $('vr').textContent=vcode($('vn').value.trim(),s,+$('ve').value,+$('vh').value,+$('vx').value,$('vs').value.trim());
}
function test(i){S.ver=$('tv').value;QS=QSALL[S.ver];PZ=PZALL[S.ver];S.name='Docente Prueba';S.grupo='10A';S.t0=Date.now();S.err=0;S.hints=0;S.sid='';active=false;i<6?go(i):fin()}

window.addEventListener('hashchange',()=>location.reload());
intro();
